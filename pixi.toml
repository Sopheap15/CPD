[workspace]
name = "cpd-track"
version = "0.1.0"
description = "Bilingual (EN/KH) CPD tracking Telegram bot backed by Excel data"
authors = ["CPD Track"]
channels = ["conda-forge"]
platforms = ["win-64", "osx-64", "linux-64"]

[dependencies]
python = "3.12.*"
pytesseract = ">=0.3.13,<0.4"
pyzbar = ">=0.1.8,<0.2"
opencv = ">=4.8,<6"

[pypi-dependencies]
python-telegram-bot = { version = ">=21.0", extras = ["job-queue"] }
pandas = ">=2.0"
openpyxl = ">=3.1"
python-dotenv = ">=1.0"
pillow = ">=10.0.0"

[tasks]
start = "python main.py"
lint = "python -m compileall -q main.py cpd"
